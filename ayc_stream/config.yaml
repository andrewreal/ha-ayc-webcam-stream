name: AYC Webcam Stream
version: "1.0.3"
slug: ayc_stream
description: Axe Yacht Club webcam to YouTube Live, with tide caption, tide chart and offline fallback
url: https://github.com/andrewreal/ha-ayc-webcam-stream
arch:
  - aarch64
startup: application
boot: auto
init: false
map:
  - addon_config:rw
  - share:rw
options:
  stream_key: ""
  output_height: 720
  fps: 15
  bitrate_k: 1500
  x264_preset: ultrafast
schema:
  stream_key: password
  output_height: int(360,1080)
  fps: int(5,30)
  bitrate_k: int(500,6000)
  x264_preset: list(ultrafast|superfast|veryfast)
